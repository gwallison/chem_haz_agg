site_name: Open-FF Chemical Hazard Aggregator

theme:
  name: material
  custom_dir: overrides
  logo: img/openFF_logo.png
  font:
    text: Lato
    code: Roboto Mono
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light-blue
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light-blue
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.tooltips
    - navigation.sections
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
  icon:
    annotation: material/help-circle
  favicon: img/favicon.ico  # Path is relative to the 'docs' directory
    
use_directory_urls: false

site_url: https://storage.googleapis.com/open-ff-chem-profiles


nav:
  - 'Chemical Index': 'index.md'
  - 'About this Project': 'about.md'
  - 'Data Sources Guide': 'sources_reference.md'
  - 'GHS Hazard Rules': 'ghs_reference.md'
  - 'FAQ': 'faq.md'

extra:
  analytics:
    provider: google
    property: G-P9QJLSJ71E # <-- This is the correct structure for GA4
    
markdown_extensions:
  - abbr
  - tables
  - pymdownx.snippets:
      # Automatically include the glossary file on every page
      auto_append:
        - includes/abbreviations.md
  - attr_list  # This line is required for custom attributes
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.emoji:  # <-- Colon is required here
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
  - javascripts/tablesort.number.js  
  - javascripts/tablesort.date.js  
  - javascripts/tooltip.js
  
extra_css:
  - stylesheets/extra.css
  
  